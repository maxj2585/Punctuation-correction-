<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Punctuation Studio</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#101625">
<style>
:root{font-family:system-ui,sans-serif;color:#edf1fc;background:#101625;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:40px 20px}h1{font-size:clamp(2rem,6vw,3.8rem);margin:12px 0}.muted,footer{color:#b2bfd7;line-height:1.7}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.panel{background:#1c263a;border:1px solid #425271;border-radius:16px;padding:22px}textarea{width:100%;min-height:360px;background:#111a2b;color:inherit;border:1px solid #687998;border-radius:10px;padding:15px;font:1rem/1.8 system-ui;resize:vertical}label{display:block;margin-bottom:10px}button,select{font:inherit;background:#344668;color:inherit;border:1px solid #7787aa;border-radius:8px;padding:10px;cursor:pointer}select{width:100%}button:disabled{opacity:.5;cursor:wait}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #b2bdff;outline-offset:3px}.issue{border-top:1px solid #52617b;padding:16px 0}.issue p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}small,a{color:#b8c9ff}footer{margin-top:24px;font-size:.85rem}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><main><small>YOUR WORDS. YOUR DEVICE.</small><h1>Punctuation Studio</h1><p class="muted">Review English punctuation with Harper’s engine, compiled from the source copied into this project.</p><div class="grid"><section class="panel"><label for="text">Your writing</label><textarea id="text" maxlength="50000" spellcheck="false" placeholder="Paste or type your writing here…"></textarea><p id="count">0 words · 0 characters</p><div class="buttons"><button id="check" disabled>Loading engine…</button><button id="fixall" disabled>Fix all</button><button id="copy">Copy text</button><button id="undo" disabled>Undo</button><button id="example">Try example</button><button id="clear">Clear</button></div><p id="status" role="status" aria-live="polite">Loading the local engine…</p></section><section class="panel"><h2>Suggestions</h2><label for="mode">Checking mode</label><select id="mode"><option value="punctuation">Punctuation & spacing</option><option value="all">All Harper checks</option></select><div id="results"><p>Check your text to see suggestions.</p></div></section></div><footer></footer></main><script type="module" src="./app.js?v=10"></script></body></html>
