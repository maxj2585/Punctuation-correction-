name: Build and deploy Punctuation Studio
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', '.github/workflows/deploy-site.yml', 'vendor/harper/**']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose what to do from your iPad'
        type: choice
        required: true
        default: build-and-deploy
        options:
          - build-and-deploy
          - check-only
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: punctuation-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build and test with readable diagnostics
        id: compile
        run: bash scripts/ipad-build.sh
      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ipad-build-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save built website
        uses: actions/upload-artifact@v7
        with:
          name: punctuation-studio-built-site
          path: site
      - name: Configure GitHub Pages
        id: pages
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'build-and-deploy')
        uses: actions/configure-pages@v6
      - name: Upload Pages website
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'build-and-deploy')
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: iPad-friendly run summary
        if: always()
        env:
          BUILD_RESULT: ${{ steps.compile.outcome }}
          PAGES_RESULT: ${{ steps.pages.outcome }}
        run: |
          {
            echo '# Punctuation Studio — iPad report'
            echo "Build and browser tests: $BUILD_RESULT"
            echo "Pages configuration: $PAGES_RESULT"
            if [ -f diagnostics/report.md ]; then cat diagnostics/report.md; fi
            echo ''
            if [ "$PAGES_RESULT" = failure ]; then
              echo 'Pages configuration failed. Check Settings → Pages and choose GitHub Actions as the publishing source. Other permissions or plan restrictions may also apply; inspect the Configure GitHub Pages step for the exact error.'
            fi
            echo ''
            echo '[Open this run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            echo '[Start a new run](https://github.com/${{ github.repository }}/actions/workflows/deploy-site.yml)'
            echo '[Edit workflow](https://github.com/${{ github.repository }}/edit/main/.github/workflows/deploy-site.yml)'
            echo '[Pages settings](https://github.com/${{ github.repository }}/settings/pages)'
            echo ''
            echo 'If this run failed, copy this report or send a screenshot. Logs are also available in the ipad-build-diagnostics artifact. These controls do not automatically repair code errors.'
          } >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'build-and-deploy'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Deployment summary
        if: always()
        env:
          DEPLOY_RESULT: ${{ steps.deployment.outcome }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo '# Punctuation Studio — deployment'
            echo "Deployment result: $DEPLOY_RESULT"
            if [ "$DEPLOY_RESULT" = success ]; then
              echo "Published URL: $SITE_URL"
              echo 'Open the URL and confirm the engine loads before treating the site as verified.'
            else
              echo 'Open the Publish website step and copy its error message. A successful build alone does not mean the site was published.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
